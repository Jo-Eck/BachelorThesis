apiVersion: v1
kind: ConfigMap
metadata:
  name: sriovdp-config
  namespace: kube-system
data:
  config.json: |
    {
      "resourceList": [{
        "resourcePrefix": "mellanox.com",
        "resourceName": "mlnx_sriov_rdma_vf",
        "selectors": {  
            "vendors": ["15b3"],
            "drivers": ["mlx5_core"],
            "pciAddresses": ["0000:08:00.1"]
          }
        }
      ] 
    }
