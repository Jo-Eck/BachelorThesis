apiVersion: v1
kind: Pod
metadata:
  name: my-test-pod-ubuntu
  annotations:
    k8s.v1.cni.cncf.io/networks: '[{"name": "ib-sriov-network"}]'
spec:
  restartPolicy: OnFailure
  containers:
    - image:  mellanox/rping-test
      imagePullPolicy: IfNotPresent
      name: my-test-ctr
      securityContext:
        capabilities:
          add: ["IPC_LOCK","SYS_ADMIN"]
        privileged: true
      command:
        - sh
        - -c
        - |
          sleep 1000000
  nodeSelector:
    kubernetes.io/hostname: node17.lab.example
