apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-notebook-server
  namespace: arkouda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-notebook
  template:
    metadata:
      labels:
        app: jupyter-notebook
    spec:
      containers:
      - name: jupyter-notebook
        image: node20.lab.example:31320/arpyter:v2024.03.18
        imagePullPolicy: Always
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits: 
            memory: "6Gi"
            cpu: "4"
        ports:
        - containerPort: 8888
        livenessProbe:
          httpGet:
            path: /api
            port: 8888
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api
            port: 8888
          initialDelaySeconds: 2
          periodSeconds: 5
    
--- 

apiVersion: v1
kind: Service
metadata:
  name: jupyter-notebook-service
spec:
  type: NodePort
  selector:
    app: jupyter-notebook
  ports:
  - protocol: TCP
    port: 8888
    nodePort: 30090 